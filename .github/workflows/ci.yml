name: CI — Qualidade, Análise Estática e Testes

on:
  push:
    branches: [ main, master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  qualidade-e-testes:
    name: Node.js ${{ matrix.node-version }} (Lint + Testes + Demo)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Análise Estática, Arquitetura (ADR-0002) e Segredos (RNF05)
        run: npm run lint

      - name: Executar Testes Automatizados (Unitários e Integração) com Cobertura
        run: npm run test:ci

      - name: Smoke Test do Incremento Executável (Demo M3/M4)
        run: npm run demo